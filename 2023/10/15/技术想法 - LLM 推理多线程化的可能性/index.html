<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Yujie Huang's blog">
    <title>Blog - Yujie Huang</title>
    <link rel="stylesheet" href="/fonts/Satoshi/satoshi.css">
    <link rel="stylesheet" href="/fontawesome/fontawesome.min.css">
    <link rel="stylesheet" href="/fontawesome/solid.min.css">
    <link rel="stylesheet" href="/fontawesome/brands.min.css">
    <link rel="preload" href="/data/content.json" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="/data/backgrounds.json" as="fetch" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/article.css">
</head>
<body class="article-page" data-article-page>
<a href="#article-content" class="skip-link">Skip to article</a>
<noscript><p class="article-error">This page needs JavaScript to load the article.</p></noscript>
<div class="page-background" aria-hidden="true"></div>
<div class="page-wrapper">
<div class="content-wrapper">
    <aside class="sidebar">
        <div class="sidebar-content">
            <a class="profile-image-frame" href="/" aria-label="Return to homepage">
                <img src="/assets/avatar.jpg" class="profile-img" alt="Yujie Huang">
            </a>
            <h1 class="profile-name">Yujie Huang<br><span lang="zh" style="font-size:1.1rem;font-weight:400">黄宇杰</span></h1>
            <div class="profile-title">Ph.D. Student</div>
            <div class="profile-affiliation">CUHK, CSE</div>
            <div class="profile-links">
                <a href="mailto:yjhuang@cse.cuhk.edu.hk" title="Email"><i class="fas fa-envelope"></i></a>
                <a href="https://github.com/hyjack-00" target="_blank" rel="noopener noreferrer" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://scholar.google.com" target="_blank" rel="noopener noreferrer" title="Google Scholar"><i class="fas fa-graduation-cap"></i></a>
            </div>
            <div class="sidebar-section" id="education">
                <h3><i class="fas fa-graduation-cap"></i> Education</h3>
                <p>Loading...</p>
            </div>
            <div class="sidebar-section" id="experience">
                <h3><i class="fas fa-briefcase"></i> Experience</h3>
                <p>Loading...</p>
            </div>
            <div class="sidebar-stats"></div>
            <div class="sidebar-footer"></div>
        </div>
    </aside>

    <main class="main-content article-main" id="article-content">
        <div class="article-layout">
            <a class="article-back" href="/#blog"><i class="fas fa-arrow-left" aria-hidden="true"></i>Back to Blog</a>
            <article class="content-card content-card--dense article-card" aria-busy="true">
                <header class="article-heading">
                    <p class="article-category">Blog</p>
                    <h1 class="article-title-heading">Loading article...</h1>
                    <time class="article-published"></time>
                </header>
                <div class="article-body"></div>
                <p class="article-error" hidden></p>
            </article>
            <nav class="article-navigation" aria-label="Blog post navigation" hidden>
                <a class="article-navigation-link article-navigation-newer" href="#"></a>
                <a class="article-navigation-link article-navigation-older" href="#"></a>
            </nav>
        </div>
    </main>
</div>
</div>

<script src="/js/background-manager.js"></script>
<script src="/js/content-renderer.js"></script>
<script src="/js/article-renderer.js"></script>
</body>
</html>
