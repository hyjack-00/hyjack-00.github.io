<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page Not Found - Yujie Huang</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/fonts/Satoshi/satoshi.css">
    <link rel="stylesheet" href="/fontawesome/fontawesome.min.css">
    <link rel="stylesheet" href="/fontawesome/solid.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="error-page">
<div class="page-background" aria-hidden="true"></div>
<main class="error-main">
    <section class="content-card content-card--dense error-card">
        <p class="error-code">404</p>
        <h1>Page not found</h1>
        <p>The page may have moved or the address may be incorrect.</p>
        <a class="error-home" href="/"><i class="fas fa-house" aria-hidden="true"></i>Back to homepage</a>
    </section>
</main>
<div class="floating-background-control">
    <button class="background-open-button background-open-button--floating" type="button" aria-label="Show full background image" aria-expanded="false" aria-controls="backgroundOverlay">
        <i class="fas fa-chevron-down" aria-hidden="true"></i>
    </button>
</div>
<div class="full-background-overlay" id="backgroundOverlay" aria-hidden="true">
    <div class="background-meta">
        <button class="background-close-button" type="button" aria-label="Return to page content">
            <i class="fas fa-xmark" aria-hidden="true"></i>
        </button>
        <p class="background-credit" aria-live="polite"></p>
    </div>
</div>
<script src="/js/background-manager.js"></script>
</body>
</html>
